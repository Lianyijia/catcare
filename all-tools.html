<script>
document.addEventListener('DOMContentLoaded', () => {
  // 获取所有的分类容器
  const containers = document.querySelectorAll('.carousel-full-width');

  containers.forEach(container => {
    const track = container.querySelector('.carousel-track');
    const leftBtn = container.querySelector('.left-arrow');
    const rightBtn = container.querySelector('.right-arrow');

    // 每次滚动的距离：一张卡片的宽度(280px) + 间距(30px)
    const scrollStep = 310;

    if (track && leftBtn && rightBtn) {
      // 右转
      rightBtn.onclick = function() {
        track.scrollBy({ left: scrollStep, behavior: 'smooth' });
      };

      // 左转
      leftBtn.onclick = function() {
        track.scrollBy({ left: -scrollStep, behavior: 'smooth' });
      };
    }
  });
});
</script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
      const menuTrigger = document.getElementById('menu-open');
      const sideMenu = document.getElementById('side-menu');
      const menuOverlay = document.getElementById('menu-overlay');

      // 切换菜单
      menuTrigger.addEventListener('click', (e) => {
        e.stopPropagation();
        sideMenu.classList.toggle('active');
        menuOverlay.classList.toggle('active');
      });

      // 点击遮罩收回
      menuOverlay.addEventListener('click', () => {
        sideMenu.classList.remove('active');
        menuOverlay.classList.remove('active');
      });

      // 点击菜单项后收回
      const menuItems = document.querySelectorAll('.menu-item');
      menuItems.forEach(item => {
        item.addEventListener('click', () => {
          sideMenu.classList.remove('active');
          menuOverlay.classList.remove('active');
        });
      });
    });
  </script>

  <div id="preview-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <a id="modal-external-link" href="#" target="_blank">Open in New Window ↗</a>
        <button class="modal-close" id="close-modal">×</button>
      </div>
      <iframe id="preview-frame" src="" frameborder="0"></iframe>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. 左右滑动逻辑
      function setupCarousel(trackId, leftArrowId, rightArrowId) {
        const track = document.getElementById(trackId);
        const leftArrow = document.getElementById(leftArrowId);
        const rightArrow = document.getElementById(rightArrowId);

        if (track && leftArrow && rightArrow) {
          rightArrow.addEventListener('click', () => {
            track.scrollBy({ left: 310, behavior: 'smooth' });
          });
          leftArrow.addEventListener('click', () => {
            track.scrollBy({ left: -310, behavior: 'smooth' });
          });
        }
      }

      // 初始化所有滑动轨道
      setupCarousel('food-art-track', 'food-art-left', 'food-art-right');
      setupCarousel('food-vid-track', 'food-vid-left', 'food-vid-right');
      setupCarousel('food-qa-track', 'food-qa-left', 'food-qa-right');

      // 2. 小窗预览逻辑
      const modal = document.getElementById('preview-modal');
      const iframe = document.getElementById('preview-frame');
      const externalLink = document.getElementById('modal-external-link');
      const closeBtn = document.getElementById('close-modal');
      const resourceCards = document.querySelectorAll('.resource-card');

      resourceCards.forEach(card => {
        card.addEventListener('click', (e) => {
          const url = card.getAttribute('href');
          if (url && (url.startsWith('http') || url.endsWith('.pdf'))) {
            e.preventDefault();
            iframe.src = url;
            externalLink.href = url;
            modal.style.display = 'flex';
          }
        });
      });

      const closeModal = () => {
        modal.style.display = 'none';
        iframe.src = '';
      };

      closeBtn.onclick = closeModal;
      modal.onclick = (e) => { if (e.target === modal) closeModal(); };
    });
  </script>
